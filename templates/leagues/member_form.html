{% extends "base/base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
  <div class="page-header">
    <div>
      <p class="eyebrow">Commissioner controls</p>
      <h1>{{ title }}</h1>
      <p>{{ league.name }}</p>
    </div>

    <div class="header-actions">
      <a class="button secondary" href="{% url 'league_detail' league.slug %}">Back to league</a>
    </div>
  </div>

  <form method="post" class="card settings-form">
    {% csrf_token %}
    {{ form.as_p }}

    <div class="actions">
      <button type="submit">{{ button_label }}</button>
      <a class="button secondary" href="{% url 'league_detail' league.slug %}">Cancel</a>
    </div>
  </form>
{% endblock %}
