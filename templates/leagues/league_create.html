{% extends "base/base.html" %}

{% block title %}Create League{% endblock %}

{% block content %}
  <div class="page-header">
    <div>
      <p class="eyebrow">New league</p>
      <h1>Create a League</h1>
    </div>

    <div class="header-actions">
      <a class="button secondary" href="{% url 'league_list' %}">Back to leagues</a>
    </div>
  </div>

  <form method="post" class="card settings-form">
    {% csrf_token %}
    {{ form.as_p }}

    <div class="actions">
      <button type="submit">Create league</button>
      <a class="button secondary" href="{% url 'league_list' %}">Cancel</a>
    </div>
  </form>
{% endblock %}
