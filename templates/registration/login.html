{% extends "base/base.html" %}

{% block title %}Log in · World Cup Draft{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <p class="eyebrow">Commissioner access</p>
    <h1>Log in</h1>
  </div>
</div>

<section class="card match-edit-card">
  {% if form.errors %}
    <p class="message">Your username and password did not match. Please try again.</p>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Log in</button>
  </form>
</section>
{% endblock %}
